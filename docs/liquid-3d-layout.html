<!doctype html><meta charset="utf-8"><title>Little Latte 3D layout checks</title>
<style>html,body{margin:0;background:#ede3d1}iframe{display:block;border:0}</style>
<iframe id="appFrame" title="Experimental latte responsive sandbox"></iframe>
<script>
const sizes={phone:[390,844],short:[320,568],tablet:[768,1024],wide:[1280,720]};
const key=new URLSearchParams(location.search).get('size')||'phone',size=sizes[key]||sizes.phone;
const f=document.getElementById('appFrame');f.width=size[0];f.height=size[1];f.src='../?mode=volume&verify=controls';document.body.style.width=size[0]+'px';
</script>
